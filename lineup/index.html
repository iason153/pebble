<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lineup — 유튜브 큐 관리</title>
<meta name="description" content="유튜브 영상을 원하는 순서로 큐에 담아, 통근시간에 맞춰 한 번에 이어보는 도구">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e0201b">
<link rel="icon" href="icons/favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lineup">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <h1 class="app-title"><span class="logo-badge" aria-hidden="true"></span>Lineup</h1>
  <button id="btn-clear-all" class="icon-btn" type="button" aria-label="큐 전체 초기화" hidden>전체삭제</button>
</header>

<main class="app-main">

  <!-- 영상 추가 영역 (1군: URL 직접 입력) -->
  <section class="add-panel">
    <form id="form-add-url" autocomplete="off" novalidate>
      <input
        id="input-url"
        type="url"
        inputmode="url"
        enterkeyhint="done"
        placeholder="유튜브 링크를 붙여넣으세요"
        aria-label="유튜브 링크 입력"
        aria-describedby="add-error"
      >
      <button type="submit" class="btn-primary">담기</button>
    </form>
    <p id="add-error" class="add-error" role="alert" hidden></p>
    <button id="btn-paste" class="paste-btn" type="button" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M9 4h6v3H9zM7 5.5H5.5A1.5 1.5 0 0 0 4 7v12.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V7a1.5 1.5 0 0 0-1.5-1.5H17"/></svg>
      복사한 링크 바로 담기
    </button>

    <!-- 클립보드 자동 감지 제안 (클립보드 읽기 권한이 허용된 브라우저) -->
    <div id="clip-suggest" class="clip-suggest" role="region" aria-label="복사한 영상 제안" hidden>
      <img id="clip-suggest-thumb" class="clip-suggest__thumb" alt="" width="64" height="36">
      <div class="clip-suggest__text">
        <span class="clip-suggest__label">방금 복사한 영상</span>
        <span id="clip-suggest-title" class="clip-suggest__title"></span>
      </div>
      <button id="btn-clip-add" class="clip-suggest__add" type="button">담기</button>
      <button id="btn-clip-close" class="clip-suggest__close" type="button" aria-label="제안 닫기">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </section>

  <!-- 통근시간 맞춤 큐 (4단계에서 실제 계산 로직 연결 예정) -->
  <section class="commute-panel" hidden>
    <label for="commute-slider">이동시간</label>
    <input id="commute-slider" type="range" min="5" max="90" step="5" value="20">
    <span id="commute-value">20분</span>
    <p id="commute-summary" class="commute-summary"></p>
  </section>

  <!-- 큐 목록 -->
  <section class="queue-panel" aria-labelledby="queue-heading">
    <div id="queue-head" class="queue-head" hidden>
      <h2 id="queue-heading" class="queue-heading">내 큐</h2>
      <span id="queue-count" class="queue-count">0개</span>
      <span id="queue-total" class="queue-total" hidden></span>
    </div>
    <ul id="queue-list" class="queue-list"></ul>
    <div id="queue-empty" class="queue-empty">
      <span class="queue-empty__icon" aria-hidden="true"></span>
      <p class="queue-empty__title">아직 담긴 영상이 없어요</p>
      <p class="queue-empty__desc">유튜브 앱에서 <b>공유 → 링크 복사</b> 후<br>위 입력창에 붙여넣어 보세요.</p>
    </div>
  </section>

</main>

<!-- 재생 시작 (4단계에서 watch_videos 재생 로직 연결 예정) -->
<footer class="app-footer">
  <button id="btn-play-queue" class="btn-play" type="button" disabled>
    재생 시작
  </button>
</footer>

<!-- 알림 토스트 (담기/삭제/되돌리기) -->
<div id="toast" class="toast" role="status" hidden>
  <span id="toast-msg" class="toast__msg"></span>
  <button id="toast-action" class="toast__action" type="button" hidden>되돌리기</button>
</div>

<!-- 스크린리더 전용 상태 안내 -->
<p id="sr-status" class="sr-only" aria-live="polite"></p>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
