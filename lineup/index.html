<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lineup — 유튜브 큐 관리</title>
<meta name="description" content="유튜브 영상을 원하는 순서로 큐에 담아, 통근시간에 맞춰 한 번에 이어보는 도구">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e0201b">
<link rel="icon" href="icons/favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lineup">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <h1 class="app-title"><span class="logo-badge" aria-hidden="true"></span>Lineup</h1>
  <div class="header-actions">
    <a class="help-link" href="guide.html" aria-label="사용법">사용법</a>
    <button id="btn-install" class="install-btn" type="button" hidden>앱 설치</button>
    <button id="btn-clear-all" class="icon-btn" type="button" aria-label="큐 전체 초기화" hidden>전체삭제</button>
  </div>
</header>

<main class="app-main">

  <!-- 영상 추가 영역 (1군: URL 직접 입력) -->
  <section class="add-panel">
    <form id="form-add-url" autocomplete="off" novalidate>
      <input
        id="input-url"
        type="url"
        inputmode="url"
        enterkeyhint="done"
        placeholder="유튜브 링크를 붙여넣으세요"
        aria-label="유튜브 링크 입력"
        aria-describedby="add-error"
      >
      <button type="submit" class="btn-primary">담기</button>
    </form>
    <p id="add-error" class="add-error" role="alert" hidden></p>
    <button id="btn-paste" class="paste-btn" type="button" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M9 4h6v3H9zM7 5.5H5.5A1.5 1.5 0 0 0 4 7v12.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V7a1.5 1.5 0 0 0-1.5-1.5H17"/></svg>
      복사한 링크 바로 담기
    </button>

    <!-- 클립보드 자동 감지 제안 (클립보드 읽기 권한이 허용된 브라우저) -->
    <div id="clip-suggest" class="clip-suggest" role="region" aria-label="복사한 영상 제안" hidden>
      <img id="clip-suggest-thumb" class="clip-suggest__thumb" alt="" width="64" height="36">
      <div class="clip-suggest__text">
        <span class="clip-suggest__label">방금 복사한 영상</span>
        <span id="clip-suggest-title" class="clip-suggest__title"></span>
      </div>
      <button id="btn-clip-add" class="clip-suggest__add" type="button">담기</button>
      <button id="btn-clip-close" class="clip-suggest__close" type="button" aria-label="제안 닫기">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </section>

  <!-- 통근시간 맞춤 큐 -->
  <section id="commute-panel" class="commute-panel" hidden>
    <div class="commute-top">
      <label class="switch">
        <input id="commute-toggle" type="checkbox" role="switch">
        <span class="switch__track" aria-hidden="true"></span>
        <span class="switch__label">가는 동안 볼 만큼만</span>
      </label>
      <span id="commute-value" class="commute-value" hidden>30분</span>
    </div>
    <div id="commute-body" class="commute-body" hidden>
      <input id="commute-slider" type="range" min="5" max="120" step="5" value="30" aria-label="이동 시간(분)">
      <div class="commute-scale" aria-hidden="true"><span>5분</span><span>1시간</span><span>2시간</span></div>
      <p id="commute-summary" class="commute-summary"></p>
    </div>
  </section>

  <!-- 큐 목록 -->
  <section class="queue-panel" aria-labelledby="queue-heading">
    <div id="queue-head" class="queue-head" hidden>
      <h2 id="queue-heading" class="queue-heading">내 큐</h2>
      <span id="queue-count" class="queue-count">0개</span>
      <span id="queue-total" class="queue-total" hidden></span>
    </div>
    <ul id="queue-list" class="queue-list"></ul>
    <div id="queue-empty" class="queue-empty">
      <span class="queue-empty__icon" aria-hidden="true"></span>
      <p class="queue-empty__title">아직 담긴 영상이 없어요</p>
      <p class="queue-empty__desc">유튜브 앱에서 <b>공유 → 링크 복사</b> 후<br>위 입력창에 붙여넣으면 바로 담겨요.</p>
      <a class="queue-empty__guide" href="guide.html">처음이라면 사용법 보기 →</a>
    </div>
  </section>

</main>

<!-- 재생 시작 (4단계에서 watch_videos 재생 로직 연결 예정) -->
<footer class="app-footer">
  <button id="btn-play-queue" class="btn-play" type="button" disabled>
    <svg class="btn-play__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
    <span class="btn-play__label">재생 시작</span>
    <span id="play-meta" class="btn-play__meta"></span>
  </button>

  <!-- 재생 중 상태 바: 유튜브에서 돌아왔을 때 이어서 할 일 -->
  <div id="session-bar" class="session-bar" hidden>
    <div class="session-bar__info">
      <span class="session-bar__dot" aria-hidden="true"></span>
      <div class="session-bar__text">
        <strong>재생 중</strong>
        <span id="session-meta" class="session-bar__meta"></span>
      </div>
    </div>
    <button id="btn-session-list" class="session-bar__btn" type="button">목록</button>
    <button id="btn-session-next" class="session-bar__btn session-bar__btn--next" type="button" hidden>다음 재생</button>
    <button id="btn-session-end" class="session-bar__btn session-bar__btn--end" type="button">끝</button>
  </div>
</footer>

<!-- 재생 시트: 유튜브로 넘긴 뒤 돌아왔을 때 / 하나씩 열기 모드 -->
<div id="play-sheet" class="sheet" hidden>
  <div class="sheet__backdrop" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="play-sheet-title">
    <div class="sheet__grip" aria-hidden="true"></div>
    <h2 id="play-sheet-title" class="sheet__title">유튜브에서 재생했어요</h2>
    <p id="play-sheet-desc" class="sheet__desc"></p>
    <ol id="play-sheet-list" class="sheet__list"></ol>
    <div class="sheet__actions">
      <button id="btn-play-again" class="sheet__btn sheet__btn--primary" type="button">처음부터 다시 재생</button>
      <button class="sheet__btn" type="button" data-close>닫기</button>
    </div>
  </div>
</div>

<!-- 끝내기 시트: 어디까지 봤는지 골라 큐에서 정리 -->
<div id="end-sheet" class="sheet" hidden>
  <div class="sheet__backdrop" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="end-sheet-title">
    <div class="sheet__grip" aria-hidden="true"></div>
    <h2 id="end-sheet-title" class="sheet__title">어디까지 보셨어요?</h2>
    <p id="end-sheet-desc" class="sheet__desc">다 본 영상까지 눌러주세요. 그 영상들은 큐에서 빼고, 나머지는 다음 이동 때 그대로 남아요.</p>
    <ol id="end-sheet-list" class="sheet__list"></ol>
    <div class="sheet__actions">
      <button id="btn-end-confirm" class="sheet__btn sheet__btn--primary" type="button">끝내기</button>
      <button class="sheet__btn" type="button" data-close>취소</button>
    </div>
  </div>
</div>

<!-- 알림 토스트 (담기/삭제/되돌리기) -->
<div id="toast" class="toast" role="status" hidden>
  <span id="toast-msg" class="toast__msg"></span>
  <button id="toast-action" class="toast__action" type="button" hidden>되돌리기</button>
</div>

<!-- 스크린리더 전용 상태 안내 -->
<p id="sr-status" class="sr-only" aria-live="polite"></p>

<script src="js/config.js"></script>
<script src="js/analytics.js"></script>
<script src="js/app.js"></script>
</body>
</html>
