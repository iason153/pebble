<style>
  /* Pebble 허브 (임시 첫 화면) — 정식 허브는 Lineup 배포 후 별도 제작 예정.
     Pebble 표준: 모바일 기준 CSS, 데스크탑은 min-width 미디어쿼리로만 추가 */
  :root {
    --text: #0f0f0f;
    --muted: #606060;
    --bg: #f6f5f3;
    --surface: #ffffff;
    --border: #e6e4e0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 40px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .brand__mark {
    width: 44px;
    height: 44px;
    display: block;
  }

  h1 {
    margin: 28px 0 8px;
    font-size: 1.6rem;
    line-height: 1.35;
    letter-spacing: -0.02em;
  }

  .lead {
    margin: 0 0 28px;
    color: var(--muted);
    line-height: 1.6;
  }

  .tool {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    color: inherit;
    text-decoration: none;
    min-height: 80px;
  }

  .tool__icon {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #e0201b;
    position: relative;
  }

  .tool__icon::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-35%, -50%);
    border-style: solid;
    border-width: 10px 0 10px 16px;
    border-color: transparent transparent transparent #fff;
  }

  .tool + .tool { margin-top: 12px; }

  .tool__icon--img { background: none; overflow: hidden; }
  .tool__icon--img::after { display: none; }
  .tool__icon--img img { width: 100%; height: 100%; display: block; }

  .tool__body { flex: 1; min-width: 0; }

  .tool__name {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 700;
  }

  .tool__desc {
    margin: 3px 0 0;
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.45;
  }

  .tool__arrow {
    flex-shrink: 0;
    color: var(--muted);
    font-size: 1.2rem;
  }

  .soon {
    margin-top: 12px;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 16px;
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
  }

  footer {
    margin-top: 40px;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }

  @media (hover: hover) and (pointer: fine) {
    .tool:hover { border-color: #cfcbc4; }
  }

  @media (min-width: 640px) {
    main { padding-top: 72px; }
    h1 { font-size: 2rem; }
  }
</style>
</head>
<body>
<main>
  <div class="brand"><img class="brand__mark" src="/icons/pebble-mark-128.png" alt="" width="44" height="44">Pebble</div>

  <h1>소소한 불편을 덜어주는<br>작은 도구들</h1>
  <p class="lead">무시하고 넘어가도 되지만, 매일 조금씩 거슬리는 것들. Pebble은 그런 불편을 하나씩 골라 가벼운 웹 도구로 만들어요.</p>

  <a class="tool" href="/lineup/">
    <span class="tool__icon" aria-hidden="true"></span>
    <span class="tool__body">
      <p class="tool__name">Lineup</p>
      <p class="tool__desc">유튜브 영상을 순서대로 담아, 가는 동안 볼 만큼만 이어보기</p>
    </span>
    <span class="tool__arrow" aria-hidden="true">›</span>
  </a>

  <a class="tool" href="/tapit/">
    <span class="tool__icon tool__icon--img" aria-hidden="true"><img src="/tapit/icons/icon-192.png" alt="" width="48" height="48"></span>
    <span class="tool__body">
      <p class="tool__name">Tapit</p>
      <p class="tool__desc">자주 보내는 링크를 모아 두고, 탭 한 번으로 복사하는 링크 메모장</p>
    </span>
    <span class="tool__arrow" aria-hidden="true">›</span>
  </a>

  <a class="tool" href="/billbox/">
    <span class="tool__icon tool__icon--img" aria-hidden="true"><img src="/billbox/icons/icon-192.png" alt="" width="48" height="48"></span>
    <span class="tool__body">
      <p class="tool__name">Billbox</p>
      <p class="tool__desc">고지서를 찍으면 얼마·언제까지 읽어서 마감 전에 알려 주는 독촉장 방지 알리미</p>
    </span>
    <span class="tool__arrow" aria-hidden="true">›</span>
  </a>

  <div class="soon">다음 도구를 만들고 있어요</div>

  <footer>© Pebble · pebbleitgo.com</footer>
</main>
</body>
</html>
