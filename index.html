<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pebble — 소소한 불편을 덜어주는 작은 도구들</title>
<meta name="description" content="Pebble은 일상의 작은 불편을 덜어주는 가벼운 웹 도구를 하나씩 만들어 공개합니다. 첫 번째 도구 Lineup: 유튜브 영상을 순서대로, 가는 동안 볼 만큼만.">
<meta name="theme-color" content="#0f0f0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='36' rx='26' ry='20' fill='%230f0f0f'/%3E%3Cellipse cx='24' cy='28' rx='8' ry='4' fill='%23ffffff' opacity='.35'/%3E%3C/svg%3E">

<!-- Google tag (gtag.js) — Pebble 속성 (Lineup과 같은 측정 ID) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4Q8F4E2J61"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-4Q8F4E2J61', { tool: 'hub' });
</script>

<style>
  /* Pebble 허브 (임시 첫 화면) — 정식 허브는 Lineup 배포 후 별도 제작 예정.
     Pebble 표준: 모바일 기준 CSS, 데스크탑은 min-width 미디어쿼리로만 추가 */
  :root {
    --text: #0f0f0f;
    --muted: #606060;
    --bg: #f6f5f3;
    --surface: #ffffff;
    --border: #e6e4e0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 40px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .brand__mark {
    width: 30px;
    height: 24px;
    border-radius: 50% / 55%;
    background: var(--text);
    position: relative;
  }

  .brand__mark::after {
    content: "";
    position: absolute;
    top: 5px;
    left: 6px;
    width: 9px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
  }

  h1 {
    margin: 28px 0 8px;
    font-size: 1.6rem;
    line-height: 1.35;
    letter-spacing: -0.02em;
  }

  .lead {
    margin: 0 0 28px;
    color: var(--muted);
    line-height: 1.6;
  }

  .tool {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    color: inherit;
    text-decoration: none;
    min-height: 80px;
  }

  .tool__icon {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #e0201b;
    position: relative;
  }

  .tool__icon::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-35%, -50%);
    border-style: solid;
    border-width: 10px 0 10px 16px;
    border-color: transparent transparent transparent #fff;
  }

  .tool__body { flex: 1; min-width: 0; }

  .tool__name {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 700;
  }

  .tool__desc {
    margin: 3px 0 0;
    font-size: 0.9rem;
    color: var(--muted);
    line-height: 1.45;
  }

  .tool__arrow {
    flex-shrink: 0;
    color: var(--muted);
    font-size: 1.2rem;
  }

  .soon {
    margin-top: 12px;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 16px;
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
  }

  footer {
    margin-top: 40px;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }

  @media (hover: hover) and (pointer: fine) {
    .tool:hover { border-color: #cfcbc4; }
  }

  @media (min-width: 640px) {
    main { padding-top: 72px; }
    h1 { font-size: 2rem; }
  }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="brand__mark" aria-hidden="true"></span>Pebble</div>

  <h1>소소한 불편을 덜어주는<br>작은 도구들</h1>
  <p class="lead">무시하고 넘어가도 되지만, 매일 조금씩 거슬리는 것들. Pebble은 그런 불편을 하나씩 골라 가벼운 웹 도구로 만들어요.</p>

  <a class="tool" href="/lineup/">
    <span class="tool__icon" aria-hidden="true"></span>
    <span class="tool__body">
      <p class="tool__name">Lineup</p>
      <p class="tool__desc">유튜브 영상을 순서대로 담아, 가는 동안 볼 만큼만 이어보기</p>
    </span>
    <span class="tool__arrow" aria-hidden="true">›</span>
  </a>

  <div class="soon">다음 도구를 만들고 있어요</div>

  <footer>© Pebble · pebbleitgo.com</footer>
</main>
</body>
</html>
